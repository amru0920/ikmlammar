<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Lab 9 - Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
    <script src="function.js"></script>
    <script src="lab9.js"></script>
</head>
<body>

    <h1>SHOPPING CART</h1>
    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th></th>
                <th>#</th>
                <th>Price</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody>
            <script src="lab7.js"></script>
        </tbody>
        <tfoot>
            <tr class="totals">
                <td colspan="4">Subtotal</td>
                <td><script>outputCurrency(subtotal);</script></td>
            </tr>
            <tr class="totals">
                <td colspan="4">Tax</td>
                <td><script>outputCurrency(tax);</script></td>
            </tr>
            <tr class="totals">
                <td colspan="4">Shipping</td>
                <td><script>outputCurrency(shipping);</script></td>
            </tr>
            <tr class="totals grand-total">
                <td colspan="4">Grand Total</td>
                <td><script>outputCurrency(grand);</script></td>
            </tr>
        </tfoot>
    </table>
<script src="data.js"></script>
</body>
</html>
