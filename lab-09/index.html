<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <!-- Sambungan ke fail CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Shopping Cart</h2>
<table id="cart">
    <thead>
        <tr>
            <th colspan="2">Product</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Amount</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td class="product-image">
                <img src="kayano.jpg" alt="ASICS Gel-Kayano 30">
            </td>
            <td class="product-name">ASICS Gel-Kayano 30</td>
            <td class="quantity">
                <button class="minus">-</button>
                <input type="number" value="0" min="0">
                <button class="plus">+</button>
            </td>
            <td class="price">RM80.00</td>
            <td class="amount">RM0.00</td>
        </tr>
        <tr>
            <td class="product-image">
                <img src="nb.jpg" alt="New Balance Fresh Foam">
            </td>
            <td class="product-name">New Balance Fresh Foam</td>
            <td class="quantity">
                <button class="minus">-</button>
                <input type="number" value="0" min="0">
                <button class="plus">+</button>
            </td>
            <td class="price">RM125.00</td>
            <td class="amount">RM0.00</td>
        </tr>
        <tr>
            <td class="product-image">
                <img src="Pegasus41.jpg" alt="Nike Air Zoom Pegasus 41">
            </td>
            <td class="product-name">Nike Air Zoom Pegasus 41</td>
            <td class="quantity">
                <button class="minus">-</button>
                <input type="number" value="0" min="0">
                <button class="plus">+</button>
            </td>
            <td class="price">RM75.00</td>
            <td class="amount">RM0.00</td>
        </tr>
    </tbody>
    <tfoot>
        <tr class="totals">
            <td colspan="4">Subtotal</td>
            <td id="subtotal">RM0.00</td>
        </tr>
        <tr class="totals">
            <td colspan="4">Tax (10%)</td>
            <td id="tax">RM0.00</td>
        </tr>
        <tr class="totals">
            <td colspan="4">Shipping</td>
            <td id="shipping">RM40.00</td>
        </tr>
        <tr class="totals">
            <td colspan="4" class="grand-total">Grand Total</td>
            <td id="grandTotal" class="grand-total">RM40.00</td>
        </tr>
    </tfoot>
</table>

<!-- Sambungan ke fail-fail JavaScript mengikut urutan logik -->
<script src="data.js"></script>
<script src="function.js"></script>
<script src="Lab9.js"></script>

</body>
</html>
