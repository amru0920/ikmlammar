<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Shoes - Customer Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-nav-bar">
    <div class="top-nav-container">
        <a href="#">My Account</a> 
        <a href="#">Wish List</a> 
        <a href="#">Shopping Cart</a> 
        <a href="#">Checkout</a>
    </div>
</div>

<div class="container">
    <header>
        <h1>Squash Racket</h1>
    </header>

    <nav class="main-nav">
        <a href="#">Home</a> 
        <a href="#">About Us</a> 
        <a href="#">Product</a> 
        <a href="#">Software</a>
    </nav>

    <h2>Customer Registration</h2>

    <form>
        <h3>1. User Info</h3>
        <div class="form-row">
            <div class="form-group half-width">
                <label>First Name</label>
                <input type="text">
            </div>
            <div class="form-group half-width">
                <label>Last Name</label>
                <input type="text">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group full-width">
                <label>Email</label>
                <input type="email" placeholder="example@email.com">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group half-width">
                <label>Password</label>
                <input type="password" placeholder="at least 8 characters">
            </div>
            <div class="form-group half-width">
                <label>Password Repeat</label>
                <input type="password" placeholder="at least 8 characters">
            </div>
        </div>

        <h3>2. Location</h3>
        <div class="form-group">
            <label>Address</label>
            <input type="text" class="full-width">
        </div>
        
        <div class="form-row">
            <div class="form-group flex-2">
                <label>City</label>
                <input type="text">
            </div>
            <div class="form-group flex-1">
                <label>State</label>
                <input type="text">
            </div>
            <div class="form-group flex-1">
                <label>Zip</label>
                <input type="text">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Phone</label>
                <input type="text" placeholder="+60123456789">
            </div>
            <div class="form-group">
                <label>Country</label>
                <select>
                    <option>Malaysia</option>
                    <option>United States</option>
                    <option>Canada</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Continent</label>
            <div class="radio-group"><input type="radio" name="continent"> Asia</div>
            <div class="radio-group"><input type="radio" name="continent"> Europe</div>
            <div class="radio-group"><input type="radio" name="continent"> North America</div>
        </div>

        <h3>3. Personal Details</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Birth Day</label>
                <input type="date">
            </div>
            <div class="form-group">
                <label>Favorite Running Shoe</label>
                <input type="color" class="color-picker">
            </div>
        </div>

        <div class="form-group">
            <label>Interest In Running Shoes</label>
            <div class="range-container">
                <span>Minimal</span>
                <input type="range" min="1" max="100" class="flex-1">
                <span>Love it!</span>
            </div>
        </div>

        <h3>4. All Done</h3>
        <div class="form-group">
            <label class="font-normal">
                <input type="checkbox"> I agree to the <a href="#">Terms of the Site</a>
            </label>
        </div>
        
        <button type="submit" class="submit-btn">
            <span class="check-icon">✓</span> Sign me up!
        </button>
    </form>
</div>

<footer>
    Copyright &copy; 2026 Muhammad Ammar Bin Mahadir.
</footer>

</body>
</html>
